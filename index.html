    if (w >= 3) pool.push(['giant', w >= 4 ? 2.5 : 1], ['dancer', 1.5 + w*0.4], ['shield', 1.2 + w*0.45]);
    if (w >= 4) pool.push(['berserker', 1.3 + w*0.35]);
    if (w >= 5) pool.push(['hammer', 0.8 + w*0.22]);

      const slowed = (z.slow||0) > 0; z.slow = Math.max(0,(z.slow||0)-dt);   // 被冰凍減速中
      z.burn = Math.max(0,(z.burn||0)-dt); z.struck = Math.max(0,(z.struck||0)-dt);
      if (hopping) { z.hop = Math.max(0, z.hop-dt); z.x = z.hopFrom + (z.hopTo-z.hopFrom)*(1 - z.hop/0.55); }
      if (z.type==='dancer' && z.x < COLS*CW - 20) {   // 舞王進入畫面後，定時召喚伴舞
        z.summonT = (z.summonT ?? 2) - dt;
        if (z.summonT <= 0 && (z.summons||0) < DANCER_MAX_SUMMONS) {
          z.summonT = DANCER_SUMMON_EVERY; z.summons = (z.summons||0) + 1; sfx.dance();
          [z.row-1, z.row+1].filter(r => r>=0 && r<ROWS).forEach(r => spawnZombie('normal', r, 0, Math.min(COLS*CW+35, z.x+60)));
          $('message').textContent = '🕺 舞王殭屍召喚了伴舞！';
        }
      }
      if (z.type==='boss') {   // 殭屍王定時召喚手下
        z.summonT = (z.summonT ?? 6) - dt;
        if (z.summonT<=0) {
          z.summonT = 9; sfx.horn();
          [z.row-1, z.row+1].filter(r => r>=0 && r<ROWS).forEach(r => spawnZombie(Math.random()<0.5 ? 'cone' : 'normal', r, 0, Math.min(COLS*CW+35, z.x+70)));
          $('message').textContent = '👑 殭屍王召喚了手下！';
        }
      }
      if (blocker && !sleeping) {
        z.bite-=dt*(slowed ? ICE_SLOW_RATE : 1);
        if (z.bite<=0) { blocker.hp-=z.biteDmg; z.bite=0.8; }
        if (blocker.hp<=0) plants.splice(plants.indexOf(blocker),1);
      } else if (!hopping && !sleeping) z.x-=z.speed*(slowed ? ICE_SLOW_RATE : 1)*dt;
      if (z.hp<=0) {
        corpses.push({type:z.type, size:z.size, x:z.x, y:z.y, tx:z.eatX, ty:z.eatY, cause: z.eaten ? 'eaten' : (z.cause || ((z.burn||0)>0 ? 'burn' : 'fall')), age:0});
        zombies.splice(i,1); kills++; if (!z.eaten) sfx.die(); if(kills%5===0) sun+=25;
        almanacKills[z.type] = (almanacKills[z.type]||0) + 1; saveAlmanac();   // 圖鑑：累計擊退數
      }
      else if (z.x<5 && !mowers[z.row]) { endGame(false); return; }   // 這一列沒有割草機了才算輸
    }
    for (let i=bolts.length-1;i>=0;i--) { bolts[i].life -= dt; if (bolts[i].life <= 0) bolts.splice(i,1); }
    for (let i=armorFx.length-1;i>=0;i--) { armorFx[i].age += dt; if (armorFx[i].age > 0.45) armorFx.splice(i,1); }
    for (let i=corpses.length-1;i>=0;i--) { corpses[i].age += dt; if (corpses[i].age > DEATH_T) corpses.splice(i,1); }
    for (let i=explosions.length-1;i>=0;i--) {
      explosions[i].life -= dt;
      if (explosions[i].life<=0) explosions.splice(i,1);
    }
    for (let i=suns.length-1;i>=0;i--) {
      const s=suns[i]; s.life-=dt; s.phase+=dt*3;
      if (s.falling) { s.y=Math.min(s.baseY+85,s.y+35*dt); if(s.y>=s.baseY+85)s.falling=false; }
      if (s.life<=0) suns.splice(i,1);
    }
    if (elapsed>=WIN_TIME && zombies.length===0) { endGame(true); return; }
    updateHUD(); updateButtons();
  }

  function drawStar(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(x / 20);
    ctx.beginPath();
    for (let i=0;i<10;i++) {
      const r = i%2===0 ? 13 : 6;
      const a = i*Math.PI/5 - Math.PI/2;
      ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fillStyle='#ffcc00'; ctx.fill();
    ctx.strokeStyle='#fff3a3'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();
  }

  // 冰凍效果：只把殭屍有顏色的部分染成淺藍（用離屏畫布，不會染到透明背景）
  const tintCv = document.createElement('canvas'), tintCtx = tintCv.getContext('2d');
  function drawTinted(img, w, h, color) {
    tintCv.width = Math.ceil(w); tintCv.height = Math.ceil(h);
    tintCtx.drawImage(img, 0, 0, w, h);
    tintCtx.globalCompositeOperation = 'source-atop';
    tintCtx.fillStyle = color; tintCtx.fillRect(0, 0, w, h);
    ctx.drawImage(tintCv, -w/2, -h, w, h);
  }
  // 動畫用：以腳底中心為支點，可旋轉／壓扁拉長／受擊閃白
  function drawSprite(img, cx, bottom, w, h, rot, sx, sy, flash, deco, tint) {
    ctx.save();
    ctx.translate(cx, bottom); ctx.rotate(rot); ctx.scale(sx, sy);
    ctx.drawImage(img, -w/2, -h, w, h);
    if (tint) drawTinted(img, w, h, tint);
    if (deco) deco(w, h);   // 沒有專屬圖片時畫的配件（路障、鐵桶…）
    if (flash > 0) {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = flash;
      ctx.drawImage(img, -w/2, -h, w, h);
    }
    ctx.restore();
  }

  // 放置預覽：綠＝可種、紅＝不能種；球球顯示會壓到的範圍；鏟子標出要移除的植物
  function drawPreview() {
    if (!hover || !running || paused) return;
    const {col, row} = hover, x0 = col*CW, y0 = row*CH;
    const occupied = plants.some(p => p.col===col && p.row===row);
    if (shovel) {
      ctx.fillStyle = occupied ? 'rgba(255,80,80,.35)' : 'rgba(0,0,0,.1)'; ctx.fillRect(x0,y0,CW,CH);
      return;
    }
    if (selected === 'qiuqiu') {
      const ok = !((cd.qiuqiu||0) > 0) && sun >= costs.qiuqiu, cx = x0 + CW/2;
      const l = Math.max(0, cx - CW*BALL_RANGE), r = Math.min(COLS*CW, cx + CW*BALL_RANGE);
      const tp = Math.max(0, (row-BALL_ROWS)*CH), bt = Math.min(ROWS*CH, (row+BALL_ROWS+1)*CH);
      ctx.fillStyle = ok ? 'rgba(255,170,40,.28)' : 'rgba(255,60,60,.25)'; ctx.fillRect(l, tp, r-l, bt-tp);
      ctx.strokeStyle = ok ? 'rgba(255,140,0,.9)' : 'rgba(220,40,40,.9)'; ctx.lineWidth = 3;
      ctx.setLineDash([10,6]); ctx.strokeRect(l, tp, r-l, bt-tp); ctx.setLineDash([]);
      return;
    }
    const ok = !occupied && !((cd[selected]||0) > 0) && sun >= costs[selected];
    ctx.fillStyle = ok ? 'rgba(120,255,120,.3)' : 'rgba(255,70,70,.3)'; ctx.fillRect(x0,y0,CW,CH);
    if (selected==='puncher') { ctx.fillStyle='rgba(255,210,70,.18)'; ctx.fillRect(x0+CW/2, y0+8, Math.min(PUNCH_RANGE, COLS*CW-x0-CW/2), CH-16); }
    if (selected==='chomper') { ctx.fillStyle='rgba(230,90,160,.16)'; ctx.fillRect(x0+CW/2, y0+8, Math.min(CHOMP_RANGE, COLS*CW-x0-CW/2), CH-16); }
    if (selected==='laser') {
      ctx.fillStyle='rgba(80,220,255,.13)';
      ctx.fillRect(x0+CW/2, y0+8, COLS*CW-x0-CW/2, CH-16);
    }
    if (selected==='magnet')  {
      const l = x0, r = Math.min(COLS*CW, x0+CW/2+MAGNET_RANGE), tp = Math.max(0,(row-MAGNET_ROWS)*CH), bt = Math.min(ROWS*CH,(row+MAGNET_ROWS+1)*CH);
      ctx.fillStyle='rgba(111,155,255,.14)'; ctx.fillRect(l, tp, r-l, bt-tp);
    }
    if (selected==='flamer')  { ctx.fillStyle='rgba(255,130,40,.16)'; ctx.fillRect(x0+CW*0.78, y0+14, Math.min(FLAME_RANGE, COLS*CW-x0-CW*0.78), CH-28); }
    const img = images[selected] || images.chomperIdle;
    if (ok && img && img.complete && img.naturalWidth > 0) {      // 半透明的植物預覽圖
      const sz = plantSize[selected];
      const asp = img.naturalWidth/img.naturalHeight, dw = asp>1 ? sz : sz*asp, dh = asp>1 ? sz/asp : sz;
      ctx.globalAlpha = 0.55; ctx.drawImage(img, x0+CW/2-dw/2, y0+CH/2+sz/2-dh, dw, dh); ctx.globalAlpha = 1;
    }
  }

  // 割草機：有 images/mower.png 就用圖片，沒有就畫一台紅色小割草機
  function drawMowers(t) {
    mowers.forEach(m => {
      if (!m) return;
      const y = m.row*CH + CH/2 + 24 + (m.state==='run' ? Math.sin(t*70)*1.5 : 0);   // 啟動後會震動
      const img = images.mower;
      if (img && img.complete && img.naturalWidth > 0) {
        const sz = MOWER_SIZE, asp = img.naturalWidth/img.naturalHeight, dw = asp>1 ? sz : sz*asp, dh = asp>1 ? sz/asp : sz;
        drawSprite(img, m.x, y + 8, dw, dh, 0, 1, 1, 0);
      } else {
        ctx.save(); ctx.translate(m.x, y); ctx.scale(MOWER_SIZE/70, MOWER_SIZE/70);   // 預設割草機也跟著 MOWER_SIZE 縮放
        ctx.strokeStyle='#555'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-26,-18); ctx.lineTo(-46,-48); ctx.lineTo(-32,-52); ctx.stroke();
        ctx.fillStyle='#d93a2b'; ctx.fillRect(-28,-28,54,28);
        ctx.fillStyle='#f2776b'; ctx.fillRect(-28,-28,54,7);
        ctx.fillStyle='#bdbdbd'; ctx.fillRect(26,-10,14,9);
        ctx.fillStyle='#222';
        ctx.beginPath(); ctx.arc(-17,3,9,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(17,3,9,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#888';
        ctx.beginPath(); ctx.arc(-17,3,4,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(17,3,4,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
    });
  }

  // 殭屍倒下動畫：依死因不同——一般＝向後倒、拳擊＝被打飛倒地、球球＝壓扁、陷阱／割草機＝炸飛旋轉、火焰＝燒焦倒下
  function drawCorpses() {
    corpses.forEach(c => {
      const zt = ZTYPES[c.type];
      let img = images[zt.img], deco = null;
      if (!(img && img.complete && img.naturalWidth > 0)) { img = images.zombie; deco = zt.deco; }
      if (!(img && img.complete && img.naturalWidth > 0)) return;
      const p = Math.min(1, c.age/DEATH_T), w = c.size, bottom = c.y + ZOMBIE_SIZE/2;
      const fade = p < 0.55 ? 1 : Math.max(0, 1 - (p-0.55)/0.45), e = 1 - (1-p)*(1-p);   // e：先快後慢
      ctx.globalAlpha = fade;
      if (c.cause === 'squash') {
        const k = Math.min(1, p*5);
        drawSprite(img, c.x, bottom, w, w, 0, 1 + 0.4*k, 1 - 0.88*k, 0, deco, null);
      } else if (c.cause === 'eaten') {   // 被食人花吞掉：往嘴巴方向被拉進去、縮小、變暗
        const q = Math.min(1, c.age/0.4), sc = 1 - 0.8*q;
        ctx.globalAlpha = q < 0.7 ? 1 : Math.max(0, 1 - (q-0.7)/0.3);
        if (c.age < 0.45) {
          const b = bottom + ((c.ty + 20) - bottom)*q;
          drawSprite(img, c.x + (c.tx - c.x)*q, b, w*sc, w*sc, q*0.9, 1, 1, 0, deco, 'rgba(0,0,0,0.45)');
        }
      } else if (c.cause === 'blast') {
        ctx.save();
        ctx.translate(c.x + 70*p, bottom - w/2 - 90*Math.sin(Math.min(1, p*1.3)*Math.PI));
        ctx.rotate(p*9);
        ctx.drawImage(img, -w/2, -w/2, w, w);
        ctx.restore();
      } else {
        const burn = c.cause === 'burn', slide = (c.cause === 'punch' ? 70 : 25)*e;
        drawSprite(img, c.x + slide, bottom, w, w, e*1.45, 1, 1, 0, deco, burn ? 'rgba(25,15,5,0.75)' : null);
      }
      ctx.globalAlpha = 1;
    });
  }

  // 食人花依狀態選圖；該狀態的圖還沒放，就退回待機圖
  function chomperImg(p) {
    const key = ({open:'chomperOpen', bite:'chomperClosed', chew:'chomperClosed'})[p.chState] || 'chomperIdle';
    const ok = i => i && i.complete && i.naturalWidth > 0;
    return ok(images[key]) ? images[key] : (ok(images.chomperIdle) ? images.chomperIdle : images[key]);
  }

  // 噴火草的火焰：一串由小變大、忽明忽暗的火球
  function drawFlames(t) {
    plants.forEach(p => {
      if (p.type!=='flamer' || p.fireState!=='on') return;
      const x0 = p.col*CW + CW*0.78, y0 = p.row*CH + CH/2 + 4;
      for (let i=0;i<14;i++) {
        const k = i/13, x = x0 + k*(FLAME_RANGE-30), y = y0 + Math.sin(t*26 + i*1.7)*8*k - k*6, r = 12 + k*26 + Math.sin(t*30 + i)*3;
        const g = ctx.createRadialGradient(x,y,1,x,y,r);
        g.addColorStop(0,'rgba(255,255,200,0.95)'); g.addColorStop(0.4,'rgba(255,170,40,0.75)'); g.addColorStop(1,'rgba(220,40,10,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
      }
    });
  }

  // 被磁鐵吸走的護具：邊旋轉邊飛向磁鐵，快到時淡出
  function drawArmorFx() {
    armorFx.forEach(f => {
      const q = Math.min(1, f.age/0.45), e = q*q;
      const x = f.x + (f.tx - f.x)*e, y = f.y + (f.ty - f.y)*e - Math.sin(q*Math.PI)*40;
      ctx.save(); ctx.globalAlpha = q < 0.8 ? 1 : (1-q)/0.2;
      ctx.translate(x, y); ctx.rotate(q*10);
      ctx.font='34px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(f.icon, 0, 0); ctx.restore();
    });
  }

  // 閃電：從畫面最上方劈到目標身上的鋸齒光束（每道雷各有自己的形狀）
  function drawBolts() {
    bolts.forEach(b => {
      const a = Math.max(0, b.life/b.maxLife), topY = -GY - 20, endY = b.y - 20, N = 9;
      const rnd = i => { const v = Math.sin(b.seed + i*12.9898)*43758.5453; return v - Math.floor(v); };
      const bimg = images.lightningBolt;
      if (bimg && bimg.complete && bimg.naturalWidth > 0) {   // 有自己的雷電圖：從天上拉到殭屍身上，隨機左右翻轉、閃爍
        const w = BOLT_IMG_WIDTH, flip = rnd(99) > 0.5 ? -1 : 1, flick = 0.75 + 0.25*Math.sin(b.life*90 + b.seed);
        ctx.save(); ctx.globalAlpha = Math.min(1, a*flick*1.2); ctx.globalCompositeOperation = BOLT_BLEND;
        ctx.translate(b.x, 0); ctx.scale(flip, 1);
        ctx.drawImage(bimg, -w/2, topY, w, endY - topY);
        ctx.restore();
        return;
      }
      const pts = [];
      for (let i=0;i<=N;i++) {
        const k = i/N, jx = (i===0 || i===N) ? 0 : (rnd(i) - 0.5)*56;
        pts.push([b.x + jx, topY + (endY - topY)*k]);
      }
      const path = () => { ctx.beginPath(); pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); ctx.stroke(); };
      ctx.save(); ctx.globalAlpha = a; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.shadowColor = '#7fd0ff'; ctx.shadowBlur = 24; ctx.strokeStyle = '#bfe8ff'; ctx.lineWidth = 12; path();
      ctx.shadowBlur = 8; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 4; path();
      ctx.restore();
    });
  }

  function draw() {
    const t = animClock;   // 動畫時鐘：暫停時不前進，角色會定格
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const lawn = images.lawn;
    const hasLawn = lawn && lawn.complete && lawn.naturalWidth > 0;
    if (hasLawn) {
      // 照片鋪滿整個畫布
      ctx.drawImage(lawn, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle='#8bc85c'; ctx.fillRect(0,0,canvas.width,canvas.height);
    }
    // 之後所有遊戲物件都以「草地格子左上角」為原點
    const shk = shake>0 ? 12*shake/0.35 : 0;   // 球球落地時的畫面震動
    ctx.save(); ctx.translate(GX + (Math.random()-0.5)*shk, GY + (Math.random()-0.5)*shk);
    for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
      if (hasLawn) {
        ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1; ctx.strokeRect(c*CW,r*CH,CW,CH);
      } else {
        ctx.fillStyle=(r+c)%2?'#8ac85c':'#94d267'; ctx.fillRect(c*CW,r*CH,CW,CH);
        ctx.strokeStyle='#6da84a'; ctx.lineWidth=1; ctx.strokeRect(c*CW,r*CH,CW,CH);
      }
    }
    drawMowers(t);
    drawPreview();
    plants.forEach(p=>{
      const x=p.col*CW+CW/2,y=p.row*CH+CH/2;
      ctx.font='48px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const img = p.type==='chomper' ? chomperImg(p) : images[p.type];   // 食人花依狀態換圖：待機／張嘴／閉嘴
      let lunge = (p.type==='puncher' && p.punch>0) ? Math.sin((1 - p.punch/0.28)*Math.PI)*40 : 0;   // 出拳時往前衝
      if (p.type==='chomper') lunge = p.chState==='open' ? 22*(1 - p.chT/CHOMP_OPEN) : p.chState==='bite' ? 35 : 0;   // 張嘴時前傾、咬下時前衝

      if (p.type==='catapult') {
        const stateImg = p.catapultState === 'loaded' ? images.catapultLoaded
          : p.catapultState === 'throw' ? images.catapultThrow : images.catapultIdle;
        const fallback = '🪨';
        const s = plantSize.catapult;
        if (stateImg && stateImg.complete && stateImg.naturalWidth > 0) {
          const asp = stateImg.naturalWidth/stateImg.naturalHeight;
          const dw = asp>1 ? s : s*asp, dh = asp>1 ? s/asp : s;
          drawSprite(stateImg, x, y+s/2, dw, dh, 0, 1, 1, 0);
        } else {
          ctx.font='58px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
          ctx.fillText(fallback, x, y+5);
        }
        // 裝填時，石彈從投石器前方滑到托盤上；裝填完成後停在托盤，投出瞬間消失
        if (p.catapultState === 'loading') {
          const q = Math.min(1, p.catapultT/0.28);
          const bx = x - 10 - 30*q, by = y - 1 - 5*q;
          const rock = images.catapultProjectile;
          if (rock && rock.complete && rock.naturalWidth > 0) {
            ctx.drawImage(rock, bx-13, by-13, 26, 26);
          } else {
            ctx.font='22px sans-serif'; ctx.fillText('🪨', bx, by);
          }
        }
      } else if (p.type==='emmaBed') {
        if (img && img.complete && img.naturalWidth > 0) {
          const s = plantSize.emmaBed, asp = img.naturalWidth/img.naturalHeight;
          const dw = asp>1 ? s : s*asp, dh = asp>1 ? s/asp : s;
          drawSprite(img, x, y+s/2, dw, dh, 0, 1, 1, 0);
        } else {
          ctx.font='58px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
          ctx.fillText('🛏️',x,y+8);
        }
      } else if (p.type==='luanneTrap') {
        if (p.armTimer>0) {
          // 尚未啟動：埋在土裡，只露出一點土堆
          ctx.fillStyle='#80552d';
          ctx.beginPath(); ctx.ellipse(x,y+20,25,10,0,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#a87943';
          ctx.beginPath(); ctx.ellipse(x-3,y+16,18,7,0,0,Math.PI*2); ctx.fill();
          ctx.fillStyle='#e8f0c2'; ctx.font='12px sans-serif';
          ctx.fillText('埋藏中',x,y+39);
        } else if (img && img.complete && img.naturalWidth>0) {
          drawSprite(img,x,y+plantSize.luanneTrap/2,plantSize.luanneTrap,plantSize.luanneTrap,0,1,1,0);
        } else {
          ctx.font='46px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
          ctx.fillText('🪤',x,y+8);
        }
      } else if (img && img.complete && img.naturalWidth > 0) {
        const s = plantSize[p.type], ph = p.col*0.9 + p.row*1.7, k = p.kick||0;
        let sx = 1 + 0.12*k, sy = 1 - 0.12*k;              // 射擊時的後座力（壓扁再彈回）
        const rot = Math.sin(t*2 + ph) * 0.05;             // 左右輕輕搖擺
        sy *= 1 + Math.sin(t*3 + ph) * 0.025;              // 呼吸般的上下伸縮
        if (p.type==='sunflower' && p.produce < 1.2) {     // 快產陽光時抖動
          const g = 1 + 0.08*Math.sin(t*20); sx *= g; sy *= g;
        }
        if (p.type==='chomper' && p.chState==='chew') { const j = Math.sin(t*14); sx *= 1 + 0.07*j; sy *= 1 - 0.07*j; }   // 咀嚼：一鼓一縮

        if (p.type==='magnet' && p.pull>0) { const j = Math.sin((1 - p.pull/0.35)*Math.PI); sx *= 1 + 0.15*j; sy *= 1 - 0.1*j; }   // 吸東西時一縮一脹                                          // 咬下瞬間被拉長
        const asp = img.naturalWidth / img.naturalHeight, dw = asp>1 ? s : s*asp, dh = asp>1 ? s/asp : s;   // 保持圖片原本比例

      } else if (p.type==='iceshooter' || p.type==='puncher' || p.type==='flamer' || p.type==='chomper' || p.type==='magnet' || p.type==='laser' || p.type==='lightning' || p.type==='catapult') {   // 還沒放圖片時的替代圖

      }

        ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(x-w/2, by, w, 5);

  function almanacPic(key, emoji, badge, hidden) {

  function renderAlmanac(tab) {

      for (const id of Object.keys(PLANT_INFO)) {
        const pi = PLANT_INFO[id];
        const st = `費用 ${costs[id]}　冷卻 ${cds[id]} 秒` + (pi.noHp ? '' : `　血量 ${maxHpOf[id]}`);

    $('almanacList').innerHTML = html;
    $('tabPlants').classList.toggle('selected', tab === 'plants');
    $('tabZombies').classList.toggle('selected', tab === 'zombies');
  }
  function openAlmanac() {

  $('tabPlants').addEventListener('click', () => renderAlmanac('plants'));
  $('tabZombies').addEventListener('click', () => renderAlmanac('zombies'));
  $('almanacOverlay').addEventListener('click', e => { if (e.target === e.currentTarget) closeAlmanac(); });   // 點旁邊的暗處也能關閉

  // ===== 出戰植物（開局前選卡）=====
  const LOADOUT_SLOTS = 8;                 // 最多帶幾種植物（想更多或更少就改這個）
  const LOADOUT_KEY = 'pvz_mini_loadout_v1';
  const DEFAULT_LOADOUT = ['sunflower', 'peashooter', 'iceshooter', 'wallnut', 'luanne', 'puncher', 'flamer', 'chomper'];
  let loadout = [], draft = [];            // loadout＝本局使用；draft＝選卡畫面中暫時的選擇
  function loadLoadout() {                 // 讀取上次的選擇（沒有或壞掉就用預設組合）
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(LOADOUT_KEY)); } catch (e) {}
    const ok = Array.isArray(saved) ? saved.filter((id, i, a) => PLANT_INFO[id] && a.indexOf(id) === i).slice(0, LOADOUT_SLOTS) : [];
    loadout = ok.length ? ok : DEFAULT_LOADOUT.filter(id => PLANT_INFO[id]).slice(0, LOADOUT_SLOTS);
  }
  function saveLoadout() { try { localStorage.setItem(LOADOUT_KEY, JSON.stringify(loadout)); } catch (e) {} }
  function applyLoadout() {                // 工具列只顯示出戰植物，並依選擇順序排列
    document.querySelectorAll('[data-plant]').forEach(b => {
      const i = loadout.indexOf(b.dataset.plant);
      b.style.display = i < 0 ? 'none' : '';
      b.style.order = i < 0 ? 0 : i - 100;
    });
    if (!loadout.includes(selected)) selected = loadout[0];
    updateButtons();
  }
  function renderLoadout() {
    const full = draft.length >= LOADOUT_SLOTS;
    let html = '';
    for (const id of Object.keys(PLANT_INFO)) {
      const pi = PLANT_INFO[id], idx = draft.indexOf(id);
      const st = `費用 ${costs[id]}　冷卻 ${cds[id]} 秒` + (pi.noHp ? '' : `　血量 ${maxHpOf[id]}`);
      html += `<div class="acard lcard${idx >= 0 ? ' sel' : ''}${full && idx < 0 ? ' full' : ''}" data-id="${id}">`
            + (idx >= 0 ? `<span class="num">${idx + 1}</span>` : '')
            + `${almanacPic(pi.img, pi.emoji, '', false)}<div><h3>${names[id]}</h3><div class="st">${st}</div><div class="ds">${pi.desc}</div></div></div>`;
    }
    $('loadoutList').innerHTML = html;
    $('loadoutCount').textContent = `已選 ${draft.length} / ${LOADOUT_SLOTS}`;
    $('loadoutHint').textContent = `點卡片加入或取消，最多帶 ${LOADOUT_SLOTS} 種。卡片上的數字就是快捷鍵順序。` + (hasStarted ? '按「開始遊戲」會用新的組合重新開始本局。' : '');
    $('loadoutStart').disabled = draft.length === 0;
  }
  function openLoadout() {
    draft = loadout.slice(); choosing = true; hover = null; dragging = false;
    $('overlay').style.display = 'none';                          // 結算畫面先收起來
    $('loadoutCancel').style.display = hasStarted ? '' : 'none';  // 第一次進遊戲一定要先選，不能取消
    renderLoadout();
    $('loadoutOverlay').style.display = 'grid';
  }
  function closeLoadout() {                // 取消：回到原本的遊戲（如果是結算畫面就回到結算畫面）
    choosing = false; $('loadoutOverlay').style.display = 'none';
    if (!running) $('overlay').style.display = 'grid';
  }
  $('loadoutList').addEventListener('click', e => {
    const card = e.target.closest && e.target.closest('.lcard');
    if (!card) return;
    const id = card.dataset.id, i = draft.indexOf(id);
    if (i >= 0) draft.splice(i, 1);
    else if (draft.length < LOADOUT_SLOTS) draft.push(id);
    renderLoadout();
  });
  $('loadoutDefault').addEventListener('click', () => { draft = DEFAULT_LOADOUT.filter(id => PLANT_INFO[id]).slice(0, LOADOUT_SLOTS); renderLoadout(); });
  $('loadoutClear').addEventListener('click', () => { draft = []; renderLoadout(); });
  $('loadoutCancel').addEventListener('click', closeLoadout);
  $('loadoutStart').addEventListener('click', () => {
    if (!draft.length) return;
    loadout = draft.slice(); saveLoadout(); hasStarted = true; choosing = false;
    $('loadoutOverlay').style.display = 'none';
    reset(); applyLoadout();
    $('message').textContent = `帶了 ${loadout.length} 種植物，開始佈置防線吧！`;
  });
  $('loadoutBtn').addEventListener('click', openLoadout);
  $('changeLoadout').addEventListener('click', openLoadout);

  function endGame(win) {
    running=false;
    $('resultTitle').textContent=win?'過關！':'殭屍闖進來了！';
    $('resultText').textContent = win
      ? `恭喜守住了花園！你一共擊退了 ${kills} 隻殭屍。`
      : `你擊退了 ${kills} 隻殭屍。再試一次，調整植物配置看看能不能撐更久！`;
    bgm.pause(); win ? sfx.win() : sfx.lose();
    $('overlay').style.display='grid';
  }
  function loop(t) {
    const dt=Math.min((t-(lastTime||t))/1000,0.05); lastTime=t;
    if (!paused && !almanacOpen && !choosing) animClock += dt;
    update(dt); draw(); requestAnimationFrame(loop);
  }
  loadLoadout(); reset(); applyLoadout(); openLoadout();   // 一開始先選出戰植物
  requestAnimationFrame(loop);
})();
</script>
